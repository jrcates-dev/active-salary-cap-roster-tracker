name: ESPN inactives probe (temporary)

on:
  push:
    branches: [claude/project-thread-ndlm83]
    paths: [".github/probe/**", ".github/workflows/espn-probe.yml"]

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe-out
          python3 .github/probe/espn_probe.py 0000 > probe-out/full-now.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "probe output full roster"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
