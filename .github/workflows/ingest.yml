name: Daily ingest

# nflverse updates its releases at 07:00 UTC in season; we run 30 minutes later
# (PLAN.md, "Ingestion schedule"). Manual runs are allowed for a specific week.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (league year)"
        default: "2026"
      week:
        description: "Week (blank = latest week in the roster file)"
        default: ""
      allow_drift:
        description: "Write the snapshot even if the 1% reconciliation check fails"
        type: boolean
        default: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      CAPTRACKER_SEASON: ${{ inputs.season || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e .

      - name: Fetch nflverse sources
        run: .venv/bin/captracker fetch

      - name: Build snapshot and reconcile
        id: build
        # Phase 0: the gate is reported but does not block, because the nflverse file is
        # known to run 2-20% under OTC's active cap (see docs/phase0-findings.md).
        # Flip the default to false once the gap is closed.
        run: |
          WEEK_ARG=""
          if [ -n "${{ inputs.week }}" ]; then WEEK_ARG="--week ${{ inputs.week }}"; fi
          DRIFT=""
          if [ "${{ inputs.allow_drift || 'true' }}" = "true" ]; then DRIFT="--allow-drift"; fi
          .venv/bin/captracker $WEEK_ARG build $DRIFT | tee build.log

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: |
            pipeline/data/out/
            pipeline/build.log
          retention-days: 14

      - name: Load into Postgres
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: .venv/bin/captracker load
