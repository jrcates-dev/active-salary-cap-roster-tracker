[project]
name = "captracker"
version = "0.1.0"
description = "Ingestion pipeline for the NFL salary cap tracker: nflverse files in, team/unit/position-group rollups out."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "pyarrow>=18",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
captracker = "captracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
