name: Daily ingest and deploy

# nflverse updates its releases at 07:00 UTC in season; we run 30 minutes later
# (PLAN.md, "Ingestion schedule"). A push to main redeploys with fresh data too,
# and manual runs are allowed for a specific week.
#
# How the site is published depends on the repository's visibility:
# - Public repo: the site is built here and deployed to GitHub Pages. The data
#   snapshot is never committed; it only exists inside the build.
# - Private repo: the snapshot is committed to main, and a host watching the repo
#   (Vercel) rebuilds from it. GitHub Pages needs a paid plan for private repos.
on:
  schedule:
    - cron: "30 7 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "web/data/snapshot.json"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (league year)"
        default: "2026"
      week:
        description: "Week (blank = latest week in the roster file)"
        default: ""
      allow_drift:
        description: "Write the snapshot even if the 1% reconciliation check fails"
        type: boolean
        default: true

# Two runs must never race to push the snapshot or deploy.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    defaults:
      run:
        working-directory: pipeline
    env:
      CAPTRACKER_SEASON: ${{ inputs.season || '2026' }}
      WEEK_INPUT: ${{ inputs.week }}
      # The secrets context is not allowed in a step's `if`, so expose a flag instead.
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository visibility
        id: visibility
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$private" = "true" ]; then echo "public=false" >> "$GITHUB_OUTPUT"; else echo "public=true" >> "$GITHUB_OUTPUT"; fi
          echo "private=$private"

      # setup-uv creates and activates a venv (VIRTUAL_ENV, on PATH) when
      # python-version is set, so install into it and call the tools bare.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: pipeline/pyproject.toml
      - run: uv pip install -e .

      - name: Fetch nflverse sources
        run: captracker fetch

      - name: Build snapshot and reconcile
        # 30 of 32 teams reconcile within 1%; Baltimore and Indianapolis are still
        # open (docs/phase0-findings.md, section 6), so the gate reports but does
        # not block by default. Flip the default to false once all 32 pass.
        run: |
          WEEK_ARG=""
          if [ -n "$WEEK_INPUT" ]; then WEEK_ARG="--week $WEEK_INPUT"; fi
          DRIFT=""
          if [ "${{ inputs.allow_drift || 'true' }}" = "true" ]; then DRIFT="--allow-drift"; fi
          captracker $WEEK_ARG build $DRIFT | tee build.log

      - name: Export the site snapshot
        run: |
          WEEK_ARG=""
          if [ -n "$WEEK_INPUT" ]; then WEEK_ARG="--week $WEEK_INPUT"; fi
          captracker $WEEK_ARG export

      - name: Upload pipeline snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: |
            pipeline/data/out/
            pipeline/build.log
          retention-days: 14

      # --- Public repo: build the static site and hand it to GitHub Pages. ---
      - uses: pnpm/action-setup@v4
        if: steps.visibility.outputs.public == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.visibility.outputs.public == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the static site
        if: steps.visibility.outputs.public == 'true'
        working-directory: web
        env:
          # A project site is served from /<repo-name>.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-pages-artifact@v3
        if: steps.visibility.outputs.public == 'true'
        with:
          path: web/out

      # --- Private repo: commit the snapshot so the host rebuilds from it. ---
      - name: Commit the snapshot
        if: steps.visibility.outputs.public != 'true' && github.event_name != 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot.json stays in .gitignore so it is never committed by accident
          # from a laptop; this job adds it on purpose.
          git add -f web/data/snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          week=$(python3 -c "import json; print(json.load(open('web/data/snapshot.json'))['week'])")
          git commit -m "data: ${CAPTRACKER_SEASON} week ${week} snapshot"
          branch="${{ github.event.repository.default_branch || 'main' }}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"

      - name: Load into Postgres
        if: env.HAS_DATABASE == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: captracker load

  deploy:
    needs: ingest
    if: needs.ingest.outputs.public == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
