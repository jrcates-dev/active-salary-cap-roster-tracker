name: ESPN inactives probe (temporary)

on:
  push:
    branches: [claude/project-thread-ndlm83]
    paths: [".github/probe/**", ".github/workflows/espn-probe.yml"]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # UTC: now; 10 min after the 4:05 PM ET inactives; after the 4:25 PM ET inactives.
        at: ["0000", "1945", "2010"]
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe-out
          python3 .github/probe/espn_probe.py ${{ matrix.at }} | tee probe-out/at-${{ matrix.at }}.txt
      # Keep the output on the branch so it can be read without the logs API.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "probe output ${{ matrix.at }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
